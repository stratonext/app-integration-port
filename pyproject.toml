[tool.poetry]
name = "stratonext"
# Ocean reads this via get_integration_version(); it must be a static string.
# Ocean's monorepo CI accepts X.Y.Z, X.Y.Z-beta or X.Y.Z-dev; new integrations land as beta.
version = "0.1.0-beta"
description = "Ocean integration syncing StratoNext environments, agents, projects, tasks, scheduled jobs and reports to Port, with actions to dispatch tasks"
authors = ["Gianluca Bertelli <gianlucb@stratonext.com>"]
# Flat modules, not an installable package: `poetry install` only installs dependencies.
package-mode = false

[tool.poetry.dependencies]
# Ocean's monorepo targets ^3.12. The floor is 3.14 only because stratonext-sdk on PyPI
# requires it; lower both once the SDK is republished for 3.12.
python = ">=3.14,<4.0"
port_ocean = {version = "^0.55.2", extras = ["cli"]}
stratonext-sdk = "^0.0.12"

[tool.poetry.group.dev.dependencies]
black = ">=25.1"
mypy = "^1.3.0"
pytest = "^9.1.1"
pytest-asyncio = ">=0.24.0"
pytest-xdist = "^3.6.1"
ruff = ">=0.6.3"
towncrier = "^23.6.0"
yamllint = "^1.37.1"

[tool.towncrier]
directory = "changelog"
filename = "CHANGELOG.md"
title_format = "## {version} ({project_date})"
underlines = [""]

  [[tool.towncrier.type]]
  directory = "breaking"
  name = "Breaking Changes"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "deprecation"
  name = "Deprecations"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "feature"
  name = "Features"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "improvement"
  name = "Improvements"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "bugfix"
  name = "Bug Fixes"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "doc"
  name = "Improved Documentation"
  showcontent = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# `make lint` runs mypy, ruff, black and yamllint with these settings, same as the monorepo.
[tool.mypy]
# Tests fake Starlette requests and the SDK with SimpleNamespace; typing them buys nothing.
exclude = ['.venv', 'tests']
plugins = ["pydantic.mypy"]
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true

# stratonext-sdk ships no py.typed marker yet; drop this once it does.
[[tool.mypy.overrides]]
module = ["stratonext_sdk", "stratonext_sdk.*", "yaml"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = ["E501"]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
