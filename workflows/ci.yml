name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pipx install 'poetry>=2.0.0,<3.0.0'

      # Same three targets the Ocean monorepo runs on every integration.
      - run: make install

      - run: make lint

      - run: make test
